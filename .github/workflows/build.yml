name: Windows derleme

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Exe derle (kurulum + taşınabilir)
        run: npm run dist
      - name: Store paketi derle (.appx)
        run: npm run dist:store
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ekran-bolucu-windows
          path: |
            dist/*.exe
            dist/*.appx
