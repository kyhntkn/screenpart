name: Windows derleme

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Exe derle (kurulum + taşınabilir)
        run: npm run dist
      - name: Word ve Excel kütüphaneleri pakete girdi mi kontrol et
        shell: pwsh
        run: |
          $liste = npx --yes @electron/asar list dist/win-unpacked/resources/app.asar
          foreach ($m in 'mammoth', 'xlsx') {
            if (-not ($liste | Select-String -Pattern "node_modules.$m.package\.json")) {
              Write-Error "$m pakete girmemis. package.json icindeki dependencies bolumunu kontrol et."
              exit 1
            }
            Write-Host "$m pakette var"
          }
      - name: Store paketi derle (.appx)
        run: npm run dist:store
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-split-windows
          path: |
            dist/*.exe
            dist/*.appx
